services:
  kafka:
    image: apache/kafka:latest
    ports:
    - 9092:9092
    - 9093:9093
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://localhost:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
    - net
  xppu_frost:
    image: xppu-frost-demo:latest
    build:
      context: ../..
      dockerfile: example/simple_demo/Dockerfile
    environment:
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
    # Wait for Kafka to be fully ready before starting
    command: [sh, -c, sleep 5 && python src-gen/Main/Main.py -f false]
    networks:
    - net
networks:
  net:
    external: false
    name: net
